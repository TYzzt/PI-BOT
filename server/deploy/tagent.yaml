# T-AGNET server。集群约定与 n-88 上其他服务一致：
# ClusterIP + Traefik IngressRoute，入口 https://aicloud-app.lenovo.com.cn/tagent
# 镜像由 GitHub Actions 在 server/ 变更时推到
# registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server:latest
# 应用前先改 Secret 里的口令和 JWT（至少 32 位），并创建私有仓库拉取密钥 liuhx-aliyun-registry。
apiVersion: v1
kind: Secret
metadata:
  name: tagent
  namespace: n-88
type: Opaque
stringData:
  POSTGRES_USER: tagent
  POSTGRES_PASSWORD: change-me-db
  POSTGRES_DB: tagent
  T_AGNET_DATABASE_URL: postgresql://tagent:change-me-db@tagent-postgres:5432/tagent
  T_AGNET_ADMIN_PASSWORD: change-me-admin-password
  T_AGNET_JWT_SECRET: change-me-to-a-long-random-string
  T_AGNET_RUNNER_TOKEN: change-me-to-a-random-runner-token-32chars
  T_AGNET_RUNNER_URL: http://tagent-runner:8001
---
apiVersion: v1
kind: Service
metadata:
  name: tagent-postgres
  namespace: n-88
spec:
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    app: tagent-postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagent-postgres
  namespace: n-88
  labels:
    app: tagent-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tagent-postgres
  template:
    metadata:
      labels:
        app: tagent-postgres
    spec:
      nodeName: heto4-ai06
      containers:
        - name: postgres
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: tagent
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tagent", "-d", "tagent"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /data/pgsql
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: tagent
  namespace: n-88
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: tagent
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagent
  namespace: n-88
  labels:
    app: tagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tagent
  template:
    metadata:
      labels:
        app: tagent
    spec:
      nodeName: heto4-ai06
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      initContainers:
        - name: wait-postgres
          image: registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server:latest
          imagePullPolicy: Always
          command:
            - node
            - server/scripts/wait.mjs
            - tcp
            - tagent-postgres:5432
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
      containers:
        - name: tagent
          image: registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: tagent
          # 启用模型密钥同步时取消注释，并创建 Secret tagent-vault（键 vault.json）。
          # env:
          # - name: T_AGNET_SYNC_KEY_FILE
          #   value: /run/secrets/sync-vault.json
          # - name: T_AGNET_TAVILY_API_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: tagent
          #       key: T_AGNET_TAVILY_API_KEY
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "500m"
              memory: 512Mi
          # volumeMounts:
          # - name: vault
          #   mountPath: /run/secrets
          #   readOnly: true
      # volumes:
      # - name: vault
      #   secret:
      #     secretName: tagent-vault
      #     items:
      #     - key: vault.json
      #       path: sync-vault.json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagent-worker
  namespace: n-88
  labels:
    app: tagent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tagent-worker
  template:
    metadata:
      labels:
        app: tagent-worker
    spec:
      nodeName: heto4-ai06
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      initContainers:
        - name: wait-api
          image: registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server:latest
          imagePullPolicy: Always
          command:
            - node
            - server/scripts/wait.mjs
            - http
            - http://tagent:8000/health
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
      containers:
        - name: tagent-worker
          image: registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server:latest
          imagePullPolicy: Always
          command: ["node", "server/dist/worker.mjs"]
          envFrom:
            - secretRef:
                name: tagent
          # env:
          # - name: T_AGNET_SYNC_KEY_FILE
          #   value: /run/secrets/sync-vault.json
          # - name: T_AGNET_TAVILY_API_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: tagent
          #       key: T_AGNET_TAVILY_API_KEY
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 1Gi
          # volumeMounts:
          # - name: vault
          #   mountPath: /run/secrets
          #   readOnly: true
      # volumes:
      # - name: vault
      #   secret:
      #     secretName: tagent-vault
      #     items:
      #     - key: vault.json
      #       path: sync-vault.json
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: tagent-strip-prefix
  namespace: n-88
spec:
  stripPrefix:
    prefixes:
      - /tagent
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    kubernetes.io/ingress.class: traefik-internet
  name: tagent-https
  namespace: n-88
spec:
  entryPoints:
    - https
  routes:
    - kind: Rule
      match: Host(`aicloud-app.lenovo.com.cn`) && PathPrefix(`/tagent`)
      middlewares:
        - name: tagent-strip-prefix
      services:
        - kind: Service
          name: tagent
          namespace: n-88
          port: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tagent-runner-data
  namespace: n-88
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tagent-runner
  namespace: n-88
spec:
  selector:
    app: tagent-runner
  ports:
    - name: runner
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagent-runner
  namespace: n-88
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tagent-runner
  template:
    metadata:
      labels:
        app: tagent-runner
    spec:
      nodeName: heto4-ai06
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: runner
          image: registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server:latest
          command: ["node", "server/dist/runner.mjs"]
          env:
            - name: T_AGNET_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tagent
                  key: T_AGNET_RUNNER_TOKEN
            - name: T_AGNET_RUNNER_DATA_DIR
              value: /data
          # Cloud MCP secrets may be mounted separately with T_AGNET_MCP_SECRET_FILE.
          # Do not use envFrom: tagent here: the runner must not receive DB/vault credentials.
          ports:
            - containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command:
                [
                  "node",
                  "-e",
                  "fetch('http://127.0.0.1:8001/health',{headers:{Authorization:'Bearer '+process.env.T_AGNET_RUNNER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tagent-runner-data
        - name: tmp
          emptyDir: {}
