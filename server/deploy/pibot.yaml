# Pi Bot server。集群约定与 n-88 上其他服务一致：
# ClusterIP + Traefik IngressRoute，入口 https://aicloud-app.lenovo.com.cn/pibot
# 管理后台：https://aicloud-app.lenovo.com.cn/pibot/admin/
# 镜像由 GitHub Actions 推到 registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
# 应用前：
#   1. 修改下方 Secret 中的口令、JWT（至少 32 位）和 Runner token（至少 32 位）
#   2. 生成模型密钥加密文件并创建 Secret：
#        node --import tsx server/scripts/vault-key.ts "$PWD/vault.json"
#        kubectl -n n-88 create secret generic pibot-vault --from-file=vault.json
#   3. 确认私有仓库拉取密钥 liuhx-aliyun-registry 已存在
# API 必须单副本：Mac 的 WebSocket 连接和资料库 RPC 终止在 API 进程内。
apiVersion: v1
kind: Secret
metadata:
  name: pibot
  namespace: n-88
type: Opaque
stringData:
  POSTGRES_USER: pibot
  POSTGRES_PASSWORD: change-me-db
  POSTGRES_DB: pibot
  PI_BOT_DATABASE_URL: postgresql://pibot:change-me-db@pibot-postgres:5432/pibot
  PI_BOT_ADMIN_USERNAME: admin
  PI_BOT_ADMIN_PASSWORD: change-me-admin-password
  PI_BOT_JWT_SECRET: change-me-to-a-long-random-string-32chars
  PI_BOT_RUNNER_TOKEN: change-me-to-a-random-runner-token-32chars
  PI_BOT_RUNNER_URL: http://pibot-runner:8001
  PI_BOT_INTERNAL_URL: http://pibot:8000
  PI_BOT_VAULT_FILE: /run/secrets/pibot/vault.json
  PI_BOT_TAVILY_API_KEY: ""
  PI_BOT_SEARXNG_URL: http://pibot-searxng:8080
---
apiVersion: v1
kind: Service
metadata:
  name: pibot-postgres
  namespace: n-88
spec:
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    app: pibot-postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot-postgres
  namespace: n-88
  labels:
    app: pibot-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pibot-postgres
  template:
    metadata:
      labels:
        app: pibot-postgres
    spec:
      nodeName: heto4-ai06
      containers:
        - name: postgres
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: pibot, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pibot, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: pibot, key: POSTGRES_DB } }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pibot", "-d", "pibot"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /data/pgsql-pibot
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pibot
  namespace: n-88
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: pibot
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot
  namespace: n-88
  labels:
    app: pibot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pibot
  template:
    metadata:
      labels:
        app: pibot
    spec:
      nodeName: heto4-ai06
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      initContainers:
        - name: wait-postgres
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          command: ["node", "server/scripts/wait.mjs", "tcp", "pibot-postgres:5432"]
          resources:
            limits: { cpu: "500m", memory: 512Mi }
            requests: { cpu: "100m", memory: 128Mi }
      containers:
        - name: pibot
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: pibot
          readinessProbe:
            httpGet: { path: /health, port: 8000, scheme: HTTP }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000, scheme: HTTP }
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits: { cpu: "2", memory: 2Gi }
            requests: { cpu: "500m", memory: 512Mi }
          volumeMounts:
            - { name: vault, mountPath: /run/secrets/pibot, readOnly: true }
      volumes:
        - name: vault
          secret:
            secretName: pibot-vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot-worker
  namespace: n-88
  labels:
    app: pibot-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pibot-worker
  template:
    metadata:
      labels:
        app: pibot-worker
    spec:
      nodeName: heto4-ai06
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      initContainers:
        - name: wait-api
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          command: ["node", "server/scripts/wait.mjs", "http", "http://pibot:8000/health"]
          resources:
            limits: { cpu: "500m", memory: 512Mi }
            requests: { cpu: "100m", memory: 128Mi }
      containers:
        - name: pibot-worker
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          command: ["node", "server/dist/worker.mjs"]
          envFrom:
            - secretRef:
                name: pibot
          resources:
            limits: { cpu: "1", memory: 1Gi }
            requests: { cpu: "200m", memory: 256Mi }
          volumeMounts:
            - { name: vault, mountPath: /run/secrets/pibot, readOnly: true }
      volumes:
        - name: vault
          secret:
            secretName: pibot-vault
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: pibot-strip-prefix
  namespace: n-88
spec:
  stripPrefix:
    prefixes:
      - /pibot
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    kubernetes.io/ingress.class: traefik-internet
  name: pibot-https
  namespace: n-88
spec:
  entryPoints:
    - https
  routes:
    - kind: Rule
      match: Host(`aicloud-app.lenovo.com.cn`) && PathPrefix(`/pibot`)
      middlewares:
        - name: pibot-strip-prefix
      services:
        - kind: Service
          name: pibot
          namespace: n-88
          port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: pibot-runner
  namespace: n-88
spec:
  selector:
    app: pibot-runner
  ports:
    - name: runner
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot-runner
  namespace: n-88
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pibot-runner
  template:
    metadata:
      labels:
        app: pibot-runner
    spec:
      nodeName: heto4-ai06
      imagePullSecrets:
        - name: liuhx-aliyun-registry
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: runner
          image: registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
          imagePullPolicy: Always
          command: ["node", "server/dist/runner.mjs"]
          # 不要 envFrom: pibot —— Runner 不应拿到数据库、JWT 或模型密钥。
          env:
            - name: PI_BOT_RUNNER_TOKEN
              valueFrom: { secretKeyRef: { name: pibot, key: PI_BOT_RUNNER_TOKEN } }
            - name: PI_BOT_RUNNER_DATA_DIR
              value: /data
          ports:
            - containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pibot-searxng
  namespace: n-88
data:
  settings.yml: |
    # Private search gateway, reachable only on the deployment network.
    use_default_settings: true
    general:
      instance_name: Pi Bot Search
    search:
      safe_search: 0
      autocomplete: ""
      formats:
        - html
        - json
    server:
      limiter: false
      public_instance: false
      image_proxy: false
    outgoing:
      request_timeout: 6.0
      max_request_timeout: 10.0
---
apiVersion: v1
kind: Service
metadata:
  name: pibot-searxng
  namespace: n-88
spec:
  type: ClusterIP
  selector:
    app: pibot-searxng
  ports:
    - name: search
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pibot-searxng
  namespace: n-88
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pibot-searxng
  template:
    metadata:
      labels:
        app: pibot-searxng
    spec:
      containers:
        - name: searxng
          image: ghcr.io/searxng/searxng@sha256:ddd642cae6eac75412938fd846ddbf440a2df029cfeae8a562b8b205f4e35e25
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_SECRET
              valueFrom: { secretKeyRef: { name: pibot, key: PI_BOT_JWT_SECRET } }
            - name: GRANIAN_WORKERS
              value: "1"
            - name: GRANIAN_BLOCKING_THREADS
              value: "4"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
      volumes:
        - name: settings
          configMap:
            name: pibot-searxng
        - name: cache
          emptyDir: {}
