# Private search gateway, reachable only on the deployment network.
use_default_settings: true
general:
  instance_name: Pi Bot Search
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  limiter: false
  public_instance: false
  image_proxy: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
