# 服务端与共享 Agent 变更时，先验证再构建镜像。
# 仓库：registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server
# 在 GitHub 仓库 Settings → Secrets 中配置：
#   ALIYUN_REGISTRY_USER      控制台登录用户名
#   ALIYUN_REGISTRY_PASSWORD  访问凭证里的固定密码（不是登录密码）
name: server image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "packages/agent/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tagent
          POSTGRES_PASSWORD: tagent
          POSTGRES_DB: tagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tagent -d tagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
        env:
          T_AGNET_TEST_DATABASE_URL: postgresql://tagent:tagent@127.0.0.1:5432/tagent
      - run: npm run build
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server:latest
            registry.cn-beijing.aliyuncs.com/liuhx/t-agent-server:${{ github.sha }}
