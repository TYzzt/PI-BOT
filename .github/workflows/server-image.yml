# 服务端、管理后台与共享包变更时，先验证再构建镜像。
# 仓库：registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server
# 在 GitHub 仓库 Settings → Secrets 中配置：
#   ALIYUN_REGISTRY_USER      控制台登录用户名
#   ALIYUN_REGISTRY_PASSWORD  访问凭证里的固定密码（不是登录密码）
name: server image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pibot
          POSTGRES_PASSWORD: pibot
          POSTGRES_DB: pibot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pibot -d pibot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # The shared suite exercises the Mac harness, which invokes /bin/zsh.
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - run: npm ci --ignore-scripts
      - name: Validate Ubuntu deployment scripts
        run: |
          bash -n server/deploy/ubuntu/install.sh server/deploy/ubuntu/deploy.sh
          python3 -m unittest discover -s server/deploy/ubuntu -p 'test_*.py' -v
      - run: npm run typecheck
      - run: npm test
        env:
          PI_BOT_TEST_DATABASE_URL: postgresql://pibot:pibot@127.0.0.1:5432/pibot
      - run: npm run build
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:latest
            registry.cn-beijing.aliyuncs.com/liuhx/pi-bot-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
