name: Desktop platforms
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace=pi-bot-desktop
      - run: node --import tsx --test desktop/tests/platform.test.ts desktop/tests/library.test.ts desktop/tests/cloud.test.ts
      - if: runner.os == 'Linux'
        run: npm rebuild electron
      - if: runner.os == 'Linux'
        run: npm run pack:linux --workspace=pi-bot-desktop
      - if: runner.os == 'Linux'
        name: Smoke test packaged service
        env:
          PI_BOT_DATA_DIR: ${{ runner.temp }}/pi-bot-smoke
          PI_BOT_LIBRARY_ROOT: ${{ runner.temp }}/pi-bot-library
        run: |
          desktop/out/linux/pi-bot-service-linux-x64/pi-bot --help
          mkdir -p "$RUNNER_TEMP/pi bot bin"
          ln -s "$PWD/desktop/out/linux/pi-bot-service-linux-x64/pi-bot" "$RUNNER_TEMP/pi bot bin/pi-bot"
          "$RUNNER_TEMP/pi bot bin/pi-bot" --help
          desktop/out/linux/pi-bot-service-linux-x64/pi-bot serve &
          service_pid=$!
          trap 'kill "$service_pid"; wait "$service_pid" || true' EXIT
          "$RUNNER_TEMP/pi bot bin/pi-bot" status
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pi-bot-linux-x64
          path: desktop/out/linux/*.tar.gz
